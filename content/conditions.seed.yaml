# Seed for the condition catalogue. `npm run catalogue:refresh` pulls labels
# and aliases for every entry from Wikidata in each supported language and
# writes src/data/conditions.json. `name` overrides a Wikidata label.
# Entries without `wikidata` are written as given.
#
# `prefill` is optional and must carry `sources` with `reviewedOn`. The
# text was drafted from the named public first-aid pages and is marked as
# not yet reviewed by a clinician in `reviewedBy`. It is a suggestion the
# user edits, never locked.
languages: [en, ta]
conditions:
  - id: type-1-diabetes
    wikidata: Q124407
    name: { en: Type 1 diabetes, ta: வகை 1 நீரிழிவு }
    aliases: { en: [T1D, IDDM, Insulin-dependent diabetes] }
    prefill:
      do:
        en:
          - "If I'm confused, sweaty, or shaky, give me sugar: juice, a sugary drink, or glucose tablets."
          - "If I'm not better in 15 minutes, give more sugar and call an ambulance."
          - "If I pass out, put me on my side and call an ambulance."
      doNot:
        en:
          - "Give me insulin."
          - "Give food or drink if I can't swallow or I'm unconscious."
      sources:
        - org: "NHS"
          title: "Low blood sugar (hypoglycaemia)"
          url: "https://www.nhs.uk/conditions/low-blood-sugar-hypoglycaemia/"
          reviewedOn: 2026-09-14
        - org: "Diabetes UK"
          title: "Hypos"
          url: "https://www.diabetes.org.uk/about-diabetes/complications/hypos"
          reviewedOn: 2026-09-14
    reviewedBy: "Drafted with AI from the sources listed. Not yet reviewed by a clinician."
