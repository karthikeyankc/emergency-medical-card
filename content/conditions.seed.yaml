  - id: epilepsy
    wikidata: Q41571
    aliases: { en: [Seizure disorder] }
    prefill:
      do:
        en:
          - "Cushion my head and move hard objects away."
          - "Time the seizure. Call an ambulance if it lasts over 5 minutes or I don't wake up."
          - "When it stops, roll me on my side and stay with me until I'm fully awake."
      doNot:
        en:
          - "Hold me down."
          - "Put anything in my mouth."
          - "Give me food or drink until I'm fully awake."
      sources:
        - org: "NHS"
          title: "Epilepsy"
          url: "https://www.nhs.uk/conditions/epilepsy/"
          reviewedOn: 2026-09-14
        - org: "Epilepsy Action"
          title: "First aid for seizures"
          url: "https://www.epilepsy.org.uk/info/firstaid"
          reviewedOn: 2026-09-14
    reviewedBy: "Drafted with AI from the sources listed. Not yet reviewed by a clinician."
  - id: asthma
    wikidata: Q35869
    prefill:
      do:
        en:
          - "Sit me upright and help me stay calm."
          - "Help me take my reliever inhaler, usually blue. One puff every 30 to 60 seconds, up to 10 puffs."
          - "Call an ambulance if I'm not better after 10 puffs or I'm getting worse."
      doNot:
        en:
          - "Lie me down."
          - "Leave me alone."
      sources:
        - org: "Asthma + Lung UK"
          title: "Asthma attacks"
          url: "https://www.asthmaandlung.org.uk/conditions/asthma/asthma-attacks"
          reviewedOn: 2026-09-14
    reviewedBy: "Drafted with AI from the sources listed. Not yet reviewed by a clinician."
  - id: anaphylaxis
    wikidata: Q168800
    aliases: { en: [Severe allergy] }
    prefill:
      do:
        en:
          - "Use my adrenaline pen on my outer thigh, through clothing if needed."
          - "Call an ambulance and say anaphylaxis."
          - "Lie me down with my legs raised. If breathing is hard, sit me up."
          - "Give a second pen after 5 minutes if I'm not better."
      doNot:
        en:
          - "Let me stand or walk, even if I feel better."
      sources:
        - org: "NHS"
          title: "Anaphylaxis"
          url: "https://www.nhs.uk/conditions/anaphylaxis/"
          reviewedOn: 2026-09-14
    reviewedBy: "Drafted with AI from the sources listed. Not yet reviewed by a clinician."
